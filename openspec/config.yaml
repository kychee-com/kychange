schema: spec-driven

context: |
  kychange is a swap desk between the two rails x402 settles on, USDC on Base and sats on
  Bitcoin Lightning, built as one Run402 application (static site, functions, Postgres,
  durable function runs). Each direction is a priced route: the platform collects the
  payment before the function runs, and the function records the swap and hands the payout
  to a durable run. Run402 never holds the funds on either leg; the operator holds the
  inventory, is the counterparty on every swap, and carries the legal obligations of
  running it with real money. docs/architecture.md is the design; functions are ESM,
  bundled per function by scripts/build.mjs because the gateway takes one source file per
  function; configuration is environment set through Run402 function secrets.
  Specs describe observable behavior of the routes, the quote, the swap states, and the
  payout runs, never implementation.
